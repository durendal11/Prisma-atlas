# ════════════════════════════════════════════════════════════════
#  PRISMA ATLAS — CI/CD Pipeline (GitHub Actions → DigitalOcean Droplet)
#
#  Trigger : push to `main`
#  Flow    :
#    1. Lint / test backend (Python) and frontend (Node/pnpm)
#    2. Build & push Docker images to Docker Hub
#    3. SSH into the DigitalOcean Droplet, pull new images, restart services
#
#  Required GitHub Secrets (Settings → Secrets → Actions):
#    DOCKERHUB_USERNAME     — Docker Hub username
#    DOCKERHUB_TOKEN        — Docker Hub access token (not password)
#    DROPLET_HOST           — IP or hostname of your DigitalOcean Droplet
#    DROPLET_USER           — SSH user on the Droplet (e.g. root or deploy)
#    DROPLET_SSH_KEY        — Private SSH key for the Droplet user
#    DROPLET_APP_DIR        — Absolute path to the app directory on the Droplet
#                             e.g. /opt/prisma-atlas/pig-ai-watch
#
#  Optional / deployment-time secrets (written to .env on the Droplet):
#    POSTGRES_USER          — (default: postgres)
#    POSTGRES_PASSWORD      — database password
#    POSTGRES_DB            — (default: pig_ai_watch)
#    SECRET_KEY             — JWT / app secret key
#    EDGE_API_KEY           — API key for edge devices
# ════════════════════════════════════════════════════════════════

name: CI/CD — Build & Deploy to DigitalOcean Droplet

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/prisma-atlas-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/prisma-atlas-frontend

jobs:
  # ──────────────────────────────────────────────────────────────
  #  JOB 1 — Lint & test the backend
  # ──────────────────────────────────────────────────────────────
  test-backend:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pig-ai-watch/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            pig-ai-watch/backend

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pig-ai-watch/backend/requirements.txt

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Lint with ruff (non-blocking on new repos)
        run: |
          pip install ruff --quiet
          ruff check . --exit-zero

  # ──────────────────────────────────────────────────────────────
  #  JOB 2 — Lint & build the frontend
  # ──────────────────────────────────────────────────────────────
  test-frontend:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pig-ai-watch/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            pig-ai-watch/frontend

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Enable pnpm via corepack
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type-check & build
        run: pnpm run build
        env:
          VITE_API_URL: ""   # empty → nginx proxy handles /api

  # ──────────────────────────────────────────────────────────────
  #  JOB 3A — Build & push backend image  (main branch only)
  # ──────────────────────────────────────────────────────────────
  build-backend-push:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            pig-ai-watch/backend

      - name: Free disk space on runner
        run: |
          echo "Disk usage before cleanup:"
          df -h
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          echo "Disk usage after cleanup:"
          df -h

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend image (classic docker)
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          export DOCKER_BUILDKIT=0

          docker build \
            --pull \
            -f pig-ai-watch/backend/Dockerfile \
            -t "${BACKEND_IMAGE}:latest" \
            -t "${BACKEND_IMAGE}:sha-${SHORT_SHA}" \
            pig-ai-watch/backend

          docker push "${BACKEND_IMAGE}:latest"
          docker push "${BACKEND_IMAGE}:sha-${SHORT_SHA}"

  # ──────────────────────────────────────────────────────────────
  #  JOB 3B — Build & push frontend image  (main branch only)
  # ──────────────────────────────────────────────────────────────
  build-frontend-push:
    name: Build & Push Frontend Image
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            pig-ai-watch/frontend

      - name: Free disk space on runner
        run: |
          echo "Disk usage before cleanup:"
          df -h
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          echo "Disk usage after cleanup:"
          df -h

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push frontend image (classic docker)
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          export DOCKER_BUILDKIT=0

          docker build \
            --pull \
            --build-arg VITE_API_URL= \
            -f pig-ai-watch/frontend/Dockerfile \
            -t "${FRONTEND_IMAGE}:latest" \
            -t "${FRONTEND_IMAGE}:sha-${SHORT_SHA}" \
            pig-ai-watch/frontend

          docker push "${FRONTEND_IMAGE}:latest"
          docker push "${FRONTEND_IMAGE}:sha-${SHORT_SHA}"

  # ──────────────────────────────────────────────────────────────
  #  JOB 4 — Deploy to DigitalOcean Droplet via SSH
  # ──────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to DigitalOcean Droplet
    runs-on: ubuntu-latest
    needs: [build-backend-push, build-frontend-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout compose file only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            pig-ai-watch/docker-compose.yml

      - name: Encode compose file for transfer
        id: compose
        run: |
          echo "content=$(base64 -w0 pig-ai-watch/docker-compose.yml)" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: BACKEND_IMAGE,FRONTEND_IMAGE
          script: |
            set -e

            APP_DIR="${{ secrets.DROPLET_APP_DIR }}"

            # ── ensure the app directory exists ───────────────────
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # ── write docker-compose.yml from workflow payload ─────
            echo '${{ steps.compose.outputs.content }}' | base64 -d > docker-compose.yml

            # ── write the production image-override file ──────────
            # Uses pre-built images from Docker Hub so the Droplet
            # never needs to recompile source code.
            cat > docker-compose.prod.yml <<OVERRIDE
            services:
              backend:
                image: ${BACKEND_IMAGE}:latest
              frontend:
                image: ${FRONTEND_IMAGE}:latest
              seed:
                image: ${BACKEND_IMAGE}:latest
            OVERRIDE

            # ── pull new images ───────────────────────────────────
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              pull backend frontend

            # ── rolling restart (zero-downtime for stateless services) ─
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              up -d --remove-orphans

            # ── clean up dangling images ──────────────────────────
            docker image prune -f

            echo "✅ Deployment complete — $(date -u)"
