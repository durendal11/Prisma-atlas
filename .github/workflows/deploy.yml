# ════════════════════════════════════════════════════════════════
#  PRISMA ATLAS — CI/CD Pipeline (GitHub Actions → DigitalOcean Droplet)
#
#  Trigger : push to `main`
#  Flow    :
#    1. Lint / test backend (Python) and frontend (Node/pnpm)
#    2. Build & push Docker images to Docker Hub
#    3. SSH into the DigitalOcean Droplet, pull new images, restart services
#
#  Required GitHub Secrets (Settings → Secrets → Actions):
#    DOCKERHUB_USERNAME     — Docker Hub username
#    DOCKERHUB_TOKEN        — Docker Hub access token (not password)
#    DROPLET_HOST           — IP or hostname of your DigitalOcean Droplet
#    DROPLET_USER           — SSH user on the Droplet (e.g. root or deploy)
#    DROPLET_SSH_KEY        — Private SSH key for the Droplet user
#    DROPLET_APP_DIR        — Absolute path to the app directory on the Droplet
#                             e.g. /opt/prisma-atlas/pig-ai-watch
#
#  Optional / deployment-time secrets (written to .env on the Droplet):
#    POSTGRES_USER          — (default: postgres)
#    POSTGRES_PASSWORD      — database password
#    POSTGRES_DB            — (default: pig_ai_watch)
#    SECRET_KEY             — JWT / app secret key
#    EDGE_API_KEY           — API key for edge devices
#    GEMINI_API_KEY         — Google Gemini API key for AI briefings/advisories
# ════════════════════════════════════════════════════════════════

name: CI/CD — Build & Deploy to DigitalOcean Droplet

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/prisma-atlas-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/prisma-atlas-frontend

jobs:
  # ──────────────────────────────────────────────────────────────
  #  JOB 1 — Lint & test the backend
  # ──────────────────────────────────────────────────────────────
  test-backend:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pig-ai-watch/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            pig-ai-watch/backend

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pig-ai-watch/backend/requirements.txt

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Lint with ruff (non-blocking on new repos)
        run: |
          pip install ruff --quiet
          ruff check . --exit-zero

  # ──────────────────────────────────────────────────────────────
  #  JOB 2 — Lint & build the frontend
  # ──────────────────────────────────────────────────────────────
  test-frontend:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pig-ai-watch/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            pig-ai-watch/frontend

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Enable pnpm via corepack
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type-check & build
        run: pnpm run build
        env:
          VITE_API_URL: ""   # empty → nginx proxy handles /api

  # ──────────────────────────────────────────────────────────────
  #  JOB 3A — Build & push backend image  (main branch only)
  # ──────────────────────────────────────────────────────────────
  build-backend-push:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            pig-ai-watch/backend

      - name: Free disk space on runner
        run: |
          echo "Disk usage before cleanup:"
          df -h
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          echo "Disk usage after cleanup:"
          df -h

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend image (classic docker)
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          export DOCKER_BUILDKIT=0

          docker build \
            --pull \
            -f pig-ai-watch/backend/Dockerfile \
            -t "${BACKEND_IMAGE}:latest" \
            -t "${BACKEND_IMAGE}:sha-${SHORT_SHA}" \
            pig-ai-watch/backend

          docker push "${BACKEND_IMAGE}:latest"
          docker push "${BACKEND_IMAGE}:sha-${SHORT_SHA}"

  # ──────────────────────────────────────────────────────────────
  #  JOB 3B — Build & push frontend image  (main branch only)
  # ──────────────────────────────────────────────────────────────
  build-frontend-push:
    name: Build & Push Frontend Image
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            pig-ai-watch/frontend

      - name: Free disk space on runner
        run: |
          echo "Disk usage before cleanup:"
          df -h
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          echo "Disk usage after cleanup:"
          df -h

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push frontend image (classic docker)
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          export DOCKER_BUILDKIT=0

          docker build \
            --pull \
            --build-arg VITE_API_URL= \
            --build-arg VITE_GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
            -f pig-ai-watch/frontend/Dockerfile \
            -t "${FRONTEND_IMAGE}:latest" \
            -t "${FRONTEND_IMAGE}:sha-${SHORT_SHA}" \
            pig-ai-watch/frontend

          docker push "${FRONTEND_IMAGE}:latest"
          docker push "${FRONTEND_IMAGE}:sha-${SHORT_SHA}"

  # ──────────────────────────────────────────────────────────────
  #  JOB 4 — Deploy to DigitalOcean Droplet via SSH
  # ──────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to DigitalOcean Droplet
    runs-on: ubuntu-latest
    needs: [build-backend-push, build-frontend-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout compose file only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            pig-ai-watch/docker-compose.yml

      - name: Encode compose file for transfer
        id: compose
        run: |
          echo "content=$(base64 -w0 pig-ai-watch/docker-compose.yml)" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: BACKEND_IMAGE,FRONTEND_IMAGE,GITHUB_SHA
          script: |
            set -e

            APP_DIR="${{ secrets.DROPLET_APP_DIR }}"
            SHORT_SHA="${GITHUB_SHA::7}"

            # Helper: read KEY=value from existing .env (if present)
            existing_env() {
              key="$1"
              if [ -f .env ]; then
                grep -E "^${key}=" .env | tail -n 1 | cut -d'=' -f2-
              fi
            }

            # ── ensure the app directory exists ───────────────────
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # ── write docker-compose.yml from workflow payload ─────
            echo '${{ steps.compose.outputs.content }}' | base64 -d > docker-compose.yml

            # ── ensure runtime .env exists for env_file consumers ──
            # Prefer GitHub secrets; if a secret is unset, keep existing server value.
            PGUSER='${{ secrets.POSTGRES_USER }}'
            [ -z "$PGUSER" ] && PGUSER="$(existing_env POSTGRES_USER)"
            [ -z "$PGUSER" ] && PGUSER='postgres'

            # Keep existing DB password by default when a persistent volume already exists.
            # This avoids auth breakage if a new secret is set but the Postgres role password
            # in the existing DB volume was not rotated.
            EXISTING_PGPASSWORD="$(existing_env POSTGRES_PASSWORD)"
            if [ -n "$EXISTING_PGPASSWORD" ]; then
              PGPASSWORD="$EXISTING_PGPASSWORD"
            else
              PGPASSWORD='${{ secrets.POSTGRES_PASSWORD }}'
              [ -z "$PGPASSWORD" ] && PGPASSWORD='postgres'
            fi

            PGDB='${{ secrets.POSTGRES_DB }}'
            [ -z "$PGDB" ] && PGDB="$(existing_env POSTGRES_DB)"
            [ -z "$PGDB" ] && PGDB='pig_ai_watch'

            APP_SECRET='${{ secrets.SECRET_KEY }}'
            [ -z "$APP_SECRET" ] && APP_SECRET="$(existing_env SECRET_KEY)"
            [ -z "$APP_SECRET" ] && APP_SECRET='change-me-in-production'

            EDGE_KEY='${{ secrets.EDGE_API_KEY }}'
            [ -z "$EDGE_KEY" ] && EDGE_KEY="$(existing_env EDGE_API_KEY)"

            GEMINI_KEY='${{ secrets.GEMINI_API_KEY }}'
            [ -z "$GEMINI_KEY" ] && GEMINI_KEY="$(existing_env GEMINI_API_KEY)"

            DEBUG_VALUE="$(existing_env DEBUG)"
            [ -z "$DEBUG_VALUE" ] && DEBUG_VALUE='false'

            LOCAL_CAMERAS_VALUE="$(existing_env LOCAL_CAMERAS_ENABLED)"
            [ -z "$LOCAL_CAMERAS_VALUE" ] && LOCAL_CAMERAS_VALUE='false'

            MEDIAMTX_VALUE="$(existing_env MEDIAMTX_ENABLED)"
            [ -z "$MEDIAMTX_VALUE" ] && MEDIAMTX_VALUE='false'

            FIREBASE_CREDS='${{ secrets.FIREBASE_CREDENTIALS_JSON }}'
            [ -z "$FIREBASE_CREDS" ] && FIREBASE_CREDS="$(existing_env FIREBASE_CREDENTIALS_JSON)"
            # Use base64 encoding to entirely bypass docker-compose quote/space parsing issues
            FIREBASE_B64=$(echo "$FIREBASE_CREDS" | base64 -w 0)

            G_CLIENT_ID='${{ secrets.GOOGLE_CLIENT_ID }}'
            [ -z "$G_CLIENT_ID" ] && G_CLIENT_ID="$(existing_env GOOGLE_CLIENT_ID)"

            G_CLIENT_SECRET='${{ secrets.GOOGLE_CLIENT_SECRET }}'
            [ -z "$G_CLIENT_SECRET" ] && G_CLIENT_SECRET="$(existing_env GOOGLE_CLIENT_SECRET)"

            cat > .env <<EOF
            POSTGRES_USER=$PGUSER
            POSTGRES_PASSWORD=$PGPASSWORD
            POSTGRES_DB=$PGDB
            SECRET_KEY=$APP_SECRET
            EDGE_API_KEY=$EDGE_KEY
            GEMINI_API_KEY=$GEMINI_KEY
            DEBUG=$DEBUG_VALUE
            LOCAL_CAMERAS_ENABLED=$LOCAL_CAMERAS_VALUE
            MEDIAMTX_ENABLED=$MEDIAMTX_VALUE
            FIREBASE_CREDENTIALS_B64=$FIREBASE_B64
            # Keep fallback for local testing if needed
            FIREBASE_CREDENTIALS_JSON='$FIREBASE_CREDS'
            GOOGLE_CLIENT_ID=$G_CLIENT_ID
            GOOGLE_CLIENT_SECRET=$G_CLIENT_SECRET
            EOF

            # ── write the production image-override file ──────────
            # Uses pre-built images from Docker Hub so the Droplet
            # never needs to recompile source code.
            cat > docker-compose.prod.yml <<OVERRIDE
            services:
              backend:
                image: ${BACKEND_IMAGE}:sha-${SHORT_SHA}
              frontend:
                image: ${FRONTEND_IMAGE}:sha-${SHORT_SHA}
              seed:
                image: ${BACKEND_IMAGE}:sha-${SHORT_SHA}
            OVERRIDE

            # ── pull new images ───────────────────────────────────
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              pull backend frontend

            # ── rolling restart (zero-downtime for stateless services) ─
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              up -d --remove-orphans

            # ── align DB role password with deployed .env to avoid auth drift ─
            # Existing postgres volumes keep old role passwords; this keeps DB + app env in sync.
            ESCAPED_PGPASSWORD=$(printf "%s" "$PGPASSWORD" | sed "s/'/''/g")
            docker exec pig-ai-watch-db psql -U "$PGUSER" -d postgres \
              -c "ALTER USER \"$PGUSER\" WITH PASSWORD '${ESCAPED_PGPASSWORD}';" || \
              echo "⚠️ Could not align DB password automatically"

            # Restart backend/frontend after potential password alignment
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              up -d backend frontend

            # ── optional seeding (disabled by default in production) ──
            RUN_SEED='${{ secrets.RUN_SEED_ON_DEPLOY }}'
            [ -z "$RUN_SEED" ] && RUN_SEED='false'

            if [ "$RUN_SEED" = "true" ]; then
              docker compose -f docker-compose.yml -f docker-compose.prod.yml \
                --profile seed up seed || echo "⚠️ Seed script failed"
            else
              echo "ℹ️ Skipping seed job (RUN_SEED_ON_DEPLOY is not true)"
            fi

            # ── clean up dangling images ──────────────────────────
            docker image prune -f

            echo "🚀 Deployment Script Finished! Checking logs for backend crash..."
            sleep 5
            echo "--- BACKEND LOGS ---"
            docker logs pig-ai-watch-backend --tail 50 || echo "Failed to get backend logs"
            echo "--- DB LOGS ---"
            docker logs pig-ai-watch-db --tail 20 || echo "Failed to get db logs"

            echo "✅ Deployment complete — $(date -u)"
