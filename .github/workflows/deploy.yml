# ════════════════════════════════════════════════════════════════
#  PRISMA ATLAS — CI/CD Pipeline (GitHub Actions → DigitalOcean Droplet)
#
#  Trigger : push to `main`
#  Flow    :
#    1. Lint / test backend (Python) and frontend (Node/pnpm)
#    2. Build & push Docker images to Docker Hub
#    3. SSH into the DigitalOcean Droplet, pull new images, restart services
#
#  Required GitHub Secrets (Settings → Secrets → Actions):
#    DOCKERHUB_USERNAME     — Docker Hub username
#    DOCKERHUB_TOKEN        — Docker Hub access token (not password)
#    DROPLET_HOST           — IP or hostname of your DigitalOcean Droplet
#    DROPLET_USER           — SSH user on the Droplet (e.g. root or deploy)
#    DROPLET_SSH_KEY        — Private SSH key for the Droplet user
#    DROPLET_APP_DIR        — Absolute path to the app directory on the Droplet
#                             e.g. /opt/prisma-atlas/pig-ai-watch
#
#  Optional / deployment-time secrets (written to .env on the Droplet):
#    POSTGRES_USER          — (default: postgres)
#    POSTGRES_PASSWORD      — database password
#    POSTGRES_DB            — (default: pig_ai_watch)
#    SECRET_KEY             — JWT / app secret key
#    EDGE_API_KEY           — API key for edge devices
# ════════════════════════════════════════════════════════════════

name: CI/CD — Build & Deploy to DigitalOcean Droplet

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/prisma-atlas-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/prisma-atlas-frontend

jobs:
  # ──────────────────────────────────────────────────────────────
  #  JOB 1 — Lint & test the backend
  # ──────────────────────────────────────────────────────────────
  test-backend:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pig-ai-watch/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pig-ai-watch/backend/requirements.txt

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Lint with ruff (non-blocking on new repos)
        run: |
          pip install ruff --quiet
          ruff check . --exit-zero

  # ──────────────────────────────────────────────────────────────
  #  JOB 2 — Lint & build the frontend
  # ──────────────────────────────────────────────────────────────
  test-frontend:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pig-ai-watch/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Enable pnpm via corepack
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type-check & build
        run: pnpm run build
        env:
          VITE_API_URL: ""   # empty → nginx proxy handles /api

  # ──────────────────────────────────────────────────────────────
  #  JOB 3 — Build & push Docker images  (main branch only)
  # ──────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space on runner
        run: |
          echo "Disk usage before cleanup:"
          df -h
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          echo "Disk usage after cleanup:"
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Git metadata (tags / labels)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Extract Git metadata — frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: pig-ai-watch/backend
          file: pig-ai-watch/backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Reclaim disk space between image builds
        run: |
          docker buildx prune -af || true
          docker system prune -af || true
          df -h

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: pig-ai-watch/frontend
          file: pig-ai-watch/frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            VITE_API_URL=
          cache-from: type=gha
          cache-to: type=gha,mode=min

  # ──────────────────────────────────────────────────────────────
  #  JOB 4 — Deploy to DigitalOcean Droplet via SSH
  # ──────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to DigitalOcean Droplet
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: BACKEND_IMAGE,FRONTEND_IMAGE
          script: |
            set -e

            APP_DIR="${{ secrets.DROPLET_APP_DIR }}"

            # ── ensure the app directory exists ───────────────────
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # ── pull latest docker-compose.yml from repo ──────────
            curl -fsSL \
              "https://raw.githubusercontent.com/${{ github.repository }}/main/pig-ai-watch/docker-compose.yml" \
              -o docker-compose.yml

            # ── write the production image-override file ──────────
            # Uses pre-built images from Docker Hub so the Droplet
            # never needs to recompile source code.
            cat > docker-compose.prod.yml <<OVERRIDE
            services:
              backend:
                image: ${BACKEND_IMAGE}:latest
              frontend:
                image: ${FRONTEND_IMAGE}:latest
              seed:
                image: ${BACKEND_IMAGE}:latest
            OVERRIDE

            # ── pull new images ───────────────────────────────────
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              pull backend frontend

            # ── rolling restart (zero-downtime for stateless services) ─
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              up -d --remove-orphans

            # ── clean up dangling images ──────────────────────────
            docker image prune -f

            echo "✅ Deployment complete — $(date -u)"
