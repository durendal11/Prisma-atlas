server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Handle SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Serve ONNX model files directly (never fall back to index.html)
    location /models/ {
        try_files $uri =404;
        types { application/octet-stream onnx; }
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
    }

    # Use Docker's internal DNS resolver so nginx re-resolves 'backend'
    # on each request instead of caching the IP at startup.
    # This prevents 502s after a backend container restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy API requests to backend
    location /api {
         
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Critical for MJPEG streaming: disable buffering
        proxy_buffering off;
        proxy_read_timeout 86400;
    }

    # Proxy WebSocket requests
    location /ws {
         
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Serve .mjs files as JavaScript modules (required for ONNX Runtime Web)
    # NOTE: no "immutable" here — allows browsers to re-validate if MIME type ever changes
    location ~* \.mjs$ {
        types { application/javascript mjs; }
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
    }

    # Serve .wasm files with correct MIME type
    location ~* \.wasm$ {
        types { application/wasm wasm; }
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
    }

    # Serve .onnx files as binary payloads
    location ~* \.onnx$ {
        types { application/octet-stream onnx; }
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
