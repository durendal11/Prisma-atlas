<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRISMA ATLAS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            -webkit-app-region: drag;
        }

        .splash-container {
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #16213e 100%);
            border-radius: 24px;
            padding: 50px 60px;
            text-align: center;
            box-shadow: 
                0 25px 80px rgba(0, 0, 0, 0.6),
                0 0 0 1px rgba(255, 255, 255, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .logo-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 25px;
        }

        .logo {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #6366f1 0%, #dedede 50%, #22d3ee 100%);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 
                    0 0 0 0 rgba(99, 102, 241, 0.4),
                    0 10px 40px rgba(99, 102, 241, 0.3);
            }
            50% {
                box-shadow: 
                    0 0 30px 10px rgba(99, 102, 241, 0.2),
                    0 15px 50px rgba(99, 102, 241, 0.4);
            }
        }

        .logo-icon {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-icon img {
            width: 150px;
            height: 150px;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #6366f1 0%, #f472b6 50%, #22d3ee 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            letter-spacing: 4px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 35px;
            font-weight: 500;
        }

        .loading-container {
            margin-bottom: 20px;
        }

        .loading-bar {
            width: 220px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin: 0 auto;
            overflow: hidden;
            position: relative;
        }

        .loading-progress {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #f472b6, #22d3ee);
            background-size: 200% 100%;
            border-radius: 3px;
            animation: shimmer 2s linear infinite, loading 3s ease-in-out forwards;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        @keyframes loading {
            0% { width: 0%; }
            20% { width: 15%; }
            40% { width: 35%; }
            60% { width: 55%; }
            80% { width: 75%; }
            95% { width: 90%; }
            100% { width: 95%; }
        }

        .status {
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            min-height: 18px;
        }

        .version {
            color: rgba(255, 255, 255, 0.2);
            font-size: 10px;
            margin-top: 25px;
            letter-spacing: 1px;
        }

        /* Spinning dots animation */
        .dots {
            display: inline-flex;
            gap: 4px;
            margin-left: 5px;
        }

        .dot {
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            animation: dotPulse 1.4s ease-in-out infinite;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotPulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="logo-container">
            <div class="logo">
                <span class="logo-icon"><img src="./assets/2.png" alt=""></span>
            </div>
        </div>
        
        <h1>PRISMA ATLAS</h1>
        <p class="subtitle">Piglet Realtime Identification & Sow Monitoring</p>
        
        <div class="loading-container">
            <div class="loading-bar">
                <div class="loading-progress"></div>
            </div>
        </div>
        
        <p class="status">
            <span id="status">Initializing</span>
            <span class="dots">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </span>
        </p>
        
        <p class="version">v1.0.0</p>
    </div>

    <script>
        const statusTexts = [
            'Initializing',
            'Loading configuration',
            'Starting backend services',
            'Loading AI models',
            'Preparing dashboard',
            'Almost ready'
        ];

        let currentIndex = 0;
        const statusElement = document.getElementById('status');

        setInterval(() => {
            currentIndex = (currentIndex + 1) % statusTexts.length;
            statusElement.textContent = statusTexts[currentIndex];
        }, 800);
    </script>
</body>
</html>
